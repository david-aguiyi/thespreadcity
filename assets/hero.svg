<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0a1f6b"/>
      <stop offset="0.45" stop-color="#06123a"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="burst" cx="0.68" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#4d8bff" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#1e6bff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#0038ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0038ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.68" cy="0.32" r="0.16">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#ffd9b0"/>
      <stop offset="0.75" stop-color="#ff5a00" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1230"/>
      <stop offset="1" stop-color="#04050a"/>
    </linearGradient>
    <linearGradient id="crowd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02030a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#burst)"/>

  <!-- light rays -->
  <g opacity="0.5" filter="url(#soft)">
    <polygon points="1088,288 700,-60 760,-60" fill="#6f9dff" opacity="0.35"/>
    <polygon points="1088,288 980,-60 1060,-60" fill="#9dbcff" opacity="0.4"/>
    <polygon points="1088,288 1260,-60 1360,-60" fill="#6f9dff" opacity="0.3"/>
    <polygon points="1088,288 1480,120 1600,60 1600,200" fill="#6f9dff" opacity="0.25"/>
    <polygon points="1088,288 520,120 480,240" fill="#6f9dff" opacity="0.2"/>
  </g>

  <!-- sun burst -->
  <circle cx="1088" cy="288" r="230" fill="url(#sun)"/>
  <circle cx="1088" cy="288" r="46" fill="#fff2e0"/>

  <!-- ember particles -->
  <g fill="#ff7a2e">
    <circle cx="760" cy="420" r="3" opacity="0.9"/>
    <circle cx="900" cy="360" r="2" opacity="0.7"/>
    <circle cx="1180" cy="440" r="3.5" opacity="0.8"/>
    <circle cx="1280" cy="520" r="2.5" opacity="0.6"/>
    <circle cx="640" cy="520" r="2.5" opacity="0.7"/>
    <circle cx="1000" cy="500" r="2" opacity="0.5"/>
    <circle cx="1360" cy="360" r="2" opacity="0.6"/>
    <circle cx="820" cy="300" r="2" opacity="0.5"/>
  </g>
  <g fill="#8fb4ff">
    <circle cx="500" cy="300" r="2" opacity="0.6"/>
    <circle cx="1420" cy="260" r="2" opacity="0.6"/>
    <circle cx="300" cy="420" r="2" opacity="0.4"/>
  </g>

  <!-- city skyline -->
  <g fill="url(#city)">
    <rect x="0"    y="560" width="120" height="340"/>
    <rect x="118"  y="500" width="90"  height="400"/>
    <rect x="205"  y="600" width="70"  height="300"/>
    <rect x="270"  y="470" width="110" height="430"/>
    <rect x="378"  y="560" width="80"  height="340"/>
    <rect x="450"  y="620" width="120" height="280"/>
    <rect x="560"  y="520" width="70"  height="380"/>
    <rect x="700"  y="600" width="90"  height="300"/>
    <rect x="900"  y="580" width="80"  height="320"/>
    <rect x="980"  y="500" width="120" height="400"/>
    <rect x="1100" y="560" width="70"  height="340"/>
    <rect x="1168" y="470" width="130" height="430"/>
    <rect x="1300" y="560" width="90"  height="340"/>
    <rect x="1388" y="600" width="80"  height="300"/>
    <rect x="1468" y="520" width="132" height="380"/>
    <!-- towers -->
    <rect x="315"  y="360" width="24"  height="540"/>
    <rect x="1218" y="360" width="24"  height="540"/>
  </g>
  <!-- window lights -->
  <g fill="#3d7bff" opacity="0.55">
    <rect x="140" y="540" width="6" height="10"/><rect x="160" y="540" width="6" height="10"/>
    <rect x="140" y="580" width="6" height="10"/><rect x="180" y="560" width="6" height="10"/>
    <rect x="300" y="520" width="6" height="10"/><rect x="330" y="540" width="6" height="10"/>
    <rect x="1010" y="540" width="6" height="10"/><rect x="1040" y="560" width="6" height="10"/>
    <rect x="1200" y="520" width="6" height="10"/><rect x="1250" y="540" width="6" height="10"/>
    <rect x="1500" y="560" width="6" height="10"/><rect x="1530" y="580" width="6" height="10"/>
  </g>
  <g fill="#ffb27a" opacity="0.7">
    <rect x="120" y="560" width="6" height="10"/><rect x="1030" y="520" width="6" height="10"/>
    <rect x="1230" y="500" width="6" height="10"/><rect x="360" y="600" width="6" height="10"/>
  </g>

  <!-- crowd silhouette with raised hands -->
  <g fill="url(#crowd)">
    <rect x="0" y="740" width="1600" height="160"/>
  </g>
  <g fill="#000000">
    <!-- repeating heads + raised arms -->
    <g id="person">
      <circle cx="0" cy="770" r="16"/>
      <path d="M-18 900 v-96 a18 18 0 0 1 36 0 v96 z"/>
      <path d="M-14 792 l-22 -46 a5 5 0 0 1 9 -4 l20 40 z"/>
      <path d="M14 792 l22 -46 a5 5 0 0 0 -9 -4 l-20 40 z"/>
    </g>
    <use href="#person" x="60"  y="6"/>
    <use href="#person" x="130" y="-8"/>
    <use href="#person" x="205" y="10"/>
    <use href="#person" x="280" y="0"/>
    <use href="#person" x="355" y="8"/>
    <use href="#person" x="430" y="-6"/>
    <use href="#person" x="510" y="6"/>
    <use href="#person" x="585" y="-4"/>
    <use href="#person" x="660" y="10"/>
    <use href="#person" x="735" y="0"/>
    <use href="#person" x="810" y="8"/>
    <use href="#person" x="885" y="-8"/>
    <use href="#person" x="960" y="6"/>
    <use href="#person" x="1035" y="-4"/>
    <use href="#person" x="1110" y="10"/>
    <use href="#person" x="1185" y="0"/>
    <use href="#person" x="1260" y="8"/>
    <use href="#person" x="1335" y="-6"/>
    <use href="#person" x="1410" y="6"/>
    <use href="#person" x="1485" y="-2"/>
    <use href="#person" x="1560" y="8"/>
  </g>

  <!-- vignette -->
  <rect width="1600" height="900" fill="url(#burst)" opacity="0"/>
  <rect x="0" y="620" width="1600" height="280" fill="#05060a" opacity="0.35"/>
</svg>
