<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 280 680 360" fill="none">
  <!-- One open hand, palm up, rising from below in an act of giving -->
  <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- outline: forearm, thumb, four fanned fingers, heel of the hand -->
    <path d="M70 640
      C 120 580, 180 520, 232 478
      C 242 452, 250 430, 262 408
      C 270 380, 280 350, 292 326
      C 300 304, 334 300, 338 324
      C 342 346, 346 372, 362 394
      C 372 408, 390 412, 404 406
      C 460 386, 552 362, 614 350
      C 640 345, 652 360, 638 374
      C 612 388, 572 400, 528 412
      C 576 402, 628 394, 660 398
      C 682 404, 680 424, 656 428
      C 622 436, 578 444, 536 448
      C 580 445, 626 444, 650 450
      C 668 456, 662 474, 640 476
      C 606 478, 566 480, 530 482
      C 560 484, 590 488, 604 494
      C 616 504, 604 518, 584 516
      C 550 514, 504 520, 470 530
      C 430 546, 390 560, 352 572
      C 300 590, 260 615, 230 640"/>

    <!-- finger creases running back into the palm -->
    <path d="M528 412 C 506 416, 486 420, 466 424" opacity=".55"/>
    <path d="M536 448 C 514 450, 494 452, 474 455" opacity=".55"/>
    <path d="M530 482 C 512 484, 494 487, 478 491" opacity=".55"/>

    <!-- knuckle folds -->
    <path d="M572 366 C 568 374, 568 386, 574 394" opacity=".45"/>
    <path d="M610 400 C 606 410, 606 422, 612 432" opacity=".45"/>
    <path d="M604 446 C 600 456, 600 466, 606 476" opacity=".45"/>
    <path d="M570 488 C 566 496, 566 506, 572 514" opacity=".45"/>
    <path d="M296 352 C 308 354, 322 358, 334 366" opacity=".45"/>

    <!-- palm lines -->
    <path d="M372 438 C 410 446, 448 446, 478 440" opacity=".5"/>
    <path d="M372 418 C 352 450, 336 490, 334 530" opacity=".5"/>
    <path d="M384 470 C 420 480, 452 494, 470 512" opacity=".4"/>

    <!-- wrist folds -->
    <path d="M240 500 C 262 518, 290 534, 322 546" opacity=".45"/>
    <path d="M226 520 C 250 538, 278 552, 310 562" opacity=".35"/>
  </g>
</svg>
