<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="gl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1e6bff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0038ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf1ff"/><stop offset="1" stop-color="#9dbcff"/>
    </linearGradient>
  </defs>
  <circle cx="400" cy="400" r="360" fill="url(#gl)"/>
  <!-- globe -->
  <circle cx="400" cy="400" r="250" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
  <g fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.5">
    <ellipse cx="400" cy="400" rx="250" ry="90"/>
    <ellipse cx="400" cy="400" rx="250" ry="175"/>
    <ellipse cx="400" cy="400" rx="90" ry="250"/>
    <ellipse cx="400" cy="400" rx="175" ry="250"/>
    <line x1="150" y1="400" x2="650" y2="400"/>
    <line x1="400" y1="150" x2="400" y2="650"/>
  </g>
  <!-- spreading nodes + pulses -->
  <g>
    <g fill="#ffffff">
      <circle cx="400" cy="400" r="9"/>
      <circle cx="300" cy="300" r="6"/>
      <circle cx="520" cy="330" r="6"/>
      <circle cx="470" cy="520" r="6"/>
      <circle cx="300" cy="500" r="5"/>
      <circle cx="560" cy="470" r="5"/>
      <circle cx="360" cy="230" r="4"/>
    </g>
    <g stroke="#ffb27a" stroke-width="2" fill="none" opacity="0.85" stroke-linecap="round">
      <path d="M400 400 L300 300"/>
      <path d="M400 400 L520 330"/>
      <path d="M400 400 L470 520"/>
      <path d="M300 300 L360 230"/>
      <path d="M520 330 L560 470"/>
      <path d="M470 520 L300 500"/>
    </g>
    <g fill="none" stroke="#ff7a2e" stroke-width="2">
      <circle cx="400" cy="400" r="22" opacity="0.6"/>
      <circle cx="400" cy="400" r="40" opacity="0.3"/>
    </g>
  </g>
